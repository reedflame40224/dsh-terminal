# ============================================================================
# dsh-terminal —— DSH bundle patch
# ============================================================================
# 插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把 dsh-terminal 插入 Web profile 的浏览器插件名录。
#
# 注意：Loader 行名必须与 lib/client.js 里 __ModuleLoader__.load 烙入的
# 注册 id 完全一致（都是 dsh-terminal），否则浏览器模块启动会拒绝
# （见 tsdown.config.ts 头部注释）。
#
# 安装：
#   dsh plugin --profile web add dsh-terminal
# 本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-terminal
      name: dsh-terminal
